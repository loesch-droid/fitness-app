<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitness Planner</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 0;
}

h2 {
  margin: 20px;
}

.section {
  background: white;
  padding: 15px;
  margin: 15px;
  border-radius: 10px;
}

.btn {
  padding: 10px 15px;
  border: 1px solid #444;
  border-radius: 6px;
  background: #eee;
  cursor: pointer;
  margin: 5px;
}

.btn.active {
  background: #4caf50;
  color: white;
}

.day-card {
  background: white;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
}

.day-header {
  display: flex;
  justify-content: space-between;
  cursor: pointer;
}

.day-body {
  display: none;
  margin-top: 10px;
}

.day-card.open .day-body {
  display: block;
}

.exercise-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
}

.day-footer {
  margin-top: 10px;
}

.day-check {
  display: none;
  font-size: 20px;
  color: green;
}
</style>
</head>
<body>

<h2>Weekend Activity</h2>
<div class="section">
  <h3>Saturday</h3>
  <div class="btn-group" data-day="Saturday" data-type="centre">
    <button class="btn weekend-btn" data-day="Saturday" data-type="centre" data-value="1">Centre</button>
  </div>
  <div class="btn-group" data-day="Saturday" data-type="training">
    <button class="btn weekend-btn" data-day="Saturday" data-type="training" data-value="1">Training</button>
  </div>
  <button class="btn weekend-btn-rest" data-day="Saturday">Rest</button>

  <h3>Sunday</h3>
  <div class="btn-group" data-day="Sunday" data-type="centre">
    <button class="btn weekend-btn" data-day="Sunday" data-type="centre" data-value="1">Centre</button>
  </div>
  <div class="btn-group" data-day="Sunday" data-type="training">
    <button class="btn weekend-btn" data-day="Sunday" data-type="training" data-value="1">Training</button>
  </div>
  <button class="btn weekend-btn-rest" data-day="Sunday">Rest</button>

  <h3>Weekend Log</h3>
  <div id="weekendLogList"></div>
</div>

<h2>Weekday Activity</h2>
<div class="section">
  <h3>Select Day</h3>
  <button class="btn weekday-day-btn" data-day="Monday">Monday</button>
  <button class="btn weekday-day-btn" data-day="Tuesday">Tuesday</button>
  <button class="btn weekday-day-btn" data-day="Wednesday">Wednesday</button>
  <button class="btn weekday-day-btn" data-day="Thursday">Thursday</button>
  <button class="btn weekday-day-btn" data-day="Friday">Friday</button>

  <h3>Select Activity</h3>
  <button class="btn weekday-activity-btn" data-type="Training">Training</button>
  <button class="btn weekday-activity-btn" data-type="Game">Game</button>

  <h3>Weekday Log</h3>
  <div id="weekdayLogList"></div>
</div>

<h2>Weekly Planner</h2>
<div id="weekGrid"></div>
<script>
/* -------------------------------------------------------
   STATE
------------------------------------------------------- */
const state = {
  fatigueScore: 0,
  weekend: {
    Saturday: { centre: 0, training: 0, rest: false },
    Sunday: { centre: 0, training: 0, rest: false }
  },
  weekday: [],
  completion: {}
};

/* -------------------------------------------------------
   WEEKEND BUTTONS (TOGGLE)
------------------------------------------------------- */
document.querySelectorAll(".weekend-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const day = btn.dataset.day;
    const type = btn.dataset.type;
    const group = btn.parentElement;

    const alreadyActive = btn.classList.contains("active");

    group.querySelectorAll(".weekend-btn").forEach(b => b.classList.remove("active"));

    if (alreadyActive) {
      state.weekend[day][type] = 0;
    } else {
      btn.classList.add("active");
      state.weekend[day][type] = Number(btn.dataset.value);
    }

    const restBtn = document.querySelector(`.weekend-btn-rest[data-day="${day}"]`);
    restBtn.classList.remove("active");
    state.weekend[day].rest = false;

    updateWeekendLog();
    recalcWeek();
  });
});

/* -------------------------------------------------------
   WEEKEND REST BUTTON (TOGGLE)
------------------------------------------------------- */
document.querySelectorAll(".weekend-btn-rest").forEach(btn => {
  btn.addEventListener("click", () => {
    const day = btn.dataset.day;
    const isActive = btn.classList.contains("active");

    if (isActive) {
      btn.classList.remove("active");
      state.weekend[day].rest = false;
    } else {
      btn.classList.add("active");
      state.weekend[day].rest = true;

      ["centre", "training"].forEach(type => {
        state.weekend[day][type] = 0;
        const group = document.querySelector(`.btn-group[data-day="${day}"][data-type="${type}"]`);
        group.querySelectorAll(".weekend-btn").forEach(b => b.classList.remove("active"));
      });
    }

    updateWeekendLog();
    recalcWeek();
  });
});

/* -------------------------------------------------------
   WEEKEND LOG
------------------------------------------------------- */
function updateWeekendLog() {
  const log = document.getElementById("weekendLogList");
  log.innerHTML = "";

  ["Saturday", "Sunday"].forEach(day => {
    const d = state.weekend[day];
    const item = document.createElement("div");

    if (d.rest) {
      item.textContent = `${day}: Rest`;
    } else {
      item.textContent = `${day}: Centre ${d.centre}, Training ${d.training}`;
    }

    log.appendChild(item);
  });
}
/* -------------------------------------------------------
   WEEKDAY BUTTONS (TOGGLE)
------------------------------------------------------- */
let selectedWeekday = null;

document.querySelectorAll(".weekday-day-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".weekday-day-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedWeekday = btn.dataset.day;
  });
});

document.querySelectorAll(".weekday-activity-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!selectedWeekday) return;

    const type = btn.dataset.type;
    const isActive = btn.classList.contains("active");

    document.querySelectorAll(".weekday-activity-btn").forEach(b => b.classList.remove("active"));

    if (isActive) {
      state.weekday = state.weekday.filter(w => w.day !== selectedWeekday);
    } else {
      btn.classList.add("active");
      state.weekday = state.weekday.filter(w => w.day !== selectedWeekday);
      state.weekday.push({ day: selectedWeekday, type });
    }

    updateWeekdayLog();
    recalcWeek();
  });
});

/* -------------------------------------------------------
   WEEKDAY LOG
------------------------------------------------------- */
function updateWeekdayLog() {
  const log = document.getElementById("weekdayLogList");
  log.innerHTML = "";

  if (state.weekday.length === 0) {
    log.textContent = "No weekday sessions logged.";
    return;
  }

  state.weekday.forEach(entry => {
    const item = document.createElement("div");
    item.textContent = `${entry.day}: ${entry.type}`;
    log.appendChild(item);
  });
}
/* -------------------------------------------------------
   INTENSITY ENGINE
------------------------------------------------------- */
function getIntensity(day) {
  const f = state.fatigueScore;

  if (f >= 70) return "Recovery";
  if (f >= 40) return "Moderate";
  return "Low";
}

/* -------------------------------------------------------
   EXERCISE BUILDER (Simplified)
------------------------------------------------------- */
function buildExercises(day, intensity) {
  const scale = {
    Low: 1,
    Moderate: 1.3,
    Recovery: 0.6
  }[intensity];

  return [
    { icon: "🏋️", main: "Push-ups", sub: `${Math.round(20 * scale)} reps × 3` },
    { icon: "💪", main: "Sit-ups", sub: `${Math.round(25 * scale)} reps × 3` },
    { icon: "🦵", main: "Squats", sub: `${Math.round(30 * scale)} reps × 3` }
  ];
}

/* -------------------------------------------------------
   DAY CARD BUILDER
------------------------------------------------------- */
function buildDayCard(day) {
  const intensity = getIntensity(day);
  const exercises = buildExercises(day, intensity);

  const card = document.createElement("div");
  card.className = "day-card";

  const header = document.createElement("div");
  header.className = "day-header";
  header.innerHTML = `
    <div>${day}</div>
    <div>${intensity}</div>
  `;

  const body = document.createElement("div");
  body.className = "day-body";

  exercises.forEach(ex => {
    const row = document.createElement("div");
    row.className = "exercise-row";
    row.innerHTML = `
      <div>${ex.icon}</div>
      <div>${ex.main}</div>
      <div>${ex.sub}</div>
    `;
    body.appendChild(row);
  });

  const footer = document.createElement("div");
  footer.className = "day-footer";

  const completeBtn = document.createElement("button");
  completeBtn.className = "btn";
  completeBtn.textContent = "Complete";

  const check = document.createElement("div");
  check.className = "day-check";
  check.textContent = "✔";

  completeBtn.addEventListener("click", () => {
    completeBtn.style.display = "none";
    check.style.display = "block";
    state.completion[day] = true;
  });

  footer.appendChild(completeBtn);
  footer.appendChild(check);

  card.appendChild(header);
  card.appendChild(body);
  card.appendChild(footer);

  header.addEventListener("click", () => {
    card.classList.toggle("open");
  });

  return card;
}

/* -------------------------------------------------------
   WEEK GRID
------------------------------------------------------- */
function rebuildWeekGrid() {
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";

  ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
    .forEach(day => grid.appendChild(buildDayCard(day)));
}
/* -------------------------------------------------------
   RECALCULATE WEEK
------------------------------------------------------- */
function recalcWeek() {
  rebuildWeekGrid();
}

/* -------------------------------------------------------
   INITIALIZE
------------------------------------------------------- */
recalcWeek();
updateWeekendLog();
updateWeekdayLog();

/* -------------------------------------------------------
   SERVICE WORKER
------------------------------------------------------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("SW registered"))
    .catch(err => console.error("SW registration failed", err));
}
</script>
</body>
</html>
